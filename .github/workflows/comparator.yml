name: Comparator verification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/comparator.yml'
      - 'comparator/**'
      - 'lean/Challenge.lean'
      - 'lean/comparator.json'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
      - 'lean/lake-manifest.json'
      - 'lean/Bapat.lean'
      - 'lean/Bapat/**'

permissions:
  contents: read

concurrency:
  group: comparator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the verification commit and full proof history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check pinned inputs and unchanged proof sources
        run: python3 comparator/check-inputs.py --receipt-dir comparator-receipt

      - name: Install pinned tools and fetch trusted Mathlib cache
        env:
          COMPARATOR_TOOLS: ${{ runner.temp }}/comparator-tools
        run: bash comparator/install-tools.sh

      - name: Compare both FC targets, audit axioms, and replay the Lean kernel
        env:
          COMPARATOR_TOOLS: ${{ runner.temp }}/comparator-tools
        run: bash comparator/run-check.sh

      - name: Save the verification receipt, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comparator-${{ github.run_id }}-${{ github.run_attempt }}
          path: comparator-receipt/
          if-no-files-found: warn
          retention-days: 90
